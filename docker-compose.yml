# Containerised toolchain for the team.
#   https://docs.docker.com/compose/compose-file/compose-file-v3/
#   https://docs.docker.com/compose/

name: visittemajuk-backend

services:
  # php artisan serve on :8000
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: visittemajuk/app:local
    container_name: visittemajuk-app
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - composer-cache:/tmp/composer
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: visittemajuk
      DB_USERNAME: visittemajuk
      DB_PASSWORD: visittemajuk
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      SESSION_DRIVER: array
      FILESYSTEM_DISK: public
      FRONTEND_URLS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks: [vtnet]
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  # Laravel queue worker.
  queue:
    image: visittemajuk/app:local
    container_name: visittemajuk-queue
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - composer-cache:/tmp/composer
    environment:
      APP_ENV: local
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: visittemajuk
      DB_USERNAME: visittemajuk
      DB_PASSWORD: visittemajuk
      QUEUE_CONNECTION: database
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    networks: [vtnet]
    command: ["php", "artisan", "queue:listen", "--tries=1", "--timeout=0"]

  # Ad-hoc runner for Pint, PHPStan, Pest, etc.
  # Use: docker compose run --rm tools composer quality
  tools:
    image: visittemajuk/app:local
    container_name: visittemajuk-tools
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - composer-cache:/tmp/composer
      - npm-cache:/root/.npm
    environment:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: visittemajuk_test
      DB_USERNAME: visittemajuk
      DB_PASSWORD: visittemajuk
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    depends_on:
      db:
        condition: service_healthy
    networks: [vtnet]
    entrypoint: ["docker/entrypoint.sh"]
    command: ["bash", "-lc", "php artisan migrate --env=testing --force && echo 'tools ready. Try: composer quality, npm run format:check' && exec bash"]

  # Standalone Node for assets, docs, and commit hooks.
  node:
    image: node:24-bookworm-slim
    container_name: visittemajuk-node
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - npm-cache:/root/.npm
    networks: [vtnet]
    command: ["bash", "-lc", "npm install && exec bash"]

  # MySQL 8 for dev and test. Official image: https://hub.docker.com/_/mysql
  db:
    image: mysql:8.4
    container_name: visittemajuk-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: visittemajuk
      MYSQL_USER: visittemajuk
      MYSQL_PASSWORD: visittemajuk
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [vtnet]

volumes:
  db-data:
  composer-cache:
  npm-cache:

networks:
  vtnet:
    driver: bridge
